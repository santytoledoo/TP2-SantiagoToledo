<div class="container">
  <div class="card">
    <h2>Iniciar Sesión</h2>
    <form>
      <div class="form-group">
        <label>Usuario o Correo</label>
        <input type="text" placeholder="Ingresá tu usuario o email" required>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" placeholder="Mínimo 8 caracteres, 1 mayúscula, 1 número" required>
      </div>
      <button type="submit" class="btn-primary">Ingresar</button>
    </form>
    <p class="link-text">¿No tenés cuenta? <a routerLink="/registro">Registrate acá</a></p>
  </div>
</div>
